# Postgres with pgvector preinstalled — for STORE=pgvector.
# `docker compose up -d` then `npm run migrate`.
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: grounded
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 20
